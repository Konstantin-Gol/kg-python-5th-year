<!DOCTYPE html> 
<html> 
<head> 
    <title>switch content</title> 
</head> 
<body> 
<button onclick="showContent('content1')">Show Content 1</button> 
<button onclick="showContent('content2')">Show Content 2</button> 
<button onclick="showContent('content3')">Show Content 3</button> 
<button onclick="showContent('content4')">Show Content 4</button> 
<div id="content1" class="content"> 
    <h2>Content 1</h2> 
    <p>This is the first content section.</p> 
</div> 
<div id="content2" class="content" style="display:none"> 
    <h2>Content 2</h2> 
    <p>This is the second content section.</p> 
</div> 
<div id="content3" class="content" style="display:none"> 
    <h2>Content 3</h2> 
    <p>This is the third content section.</p> 
</div> 
<div id="content4" class="content" style="display:none"> 
    <h2>Content 4</h2> 
    <p>This is the fourth content section.</p> 
</div> 
<script src="switch-content.js"></script> 
</body> 

</html>
